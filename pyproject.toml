[project]
name = "asr2class"
version = "0.1.0"
description = "实时语音识别翻译与语言学习工具 (Real-time ASR + LLM translation learning tool)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "openai>=1.50.0",
    "pyyaml>=6.0",
    # WASAPI loopback（系统音内录）仅 Windows 可用；WSL/Linux 开发环境自动跳过
    "pyaudiowpatch>=0.2.12; sys_platform == 'win32'",
    # Windows 上 ctranslate2 的 CUDA 运行时（cuBLAS 12 + cuDNN 9）；
    # 缺失时报 cublas64_12.dll / cudnn*.dll not found
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    # whisper_asmr VAD 的 GPU 推理（onnxruntime-gpu 的 CUDA EP 需要的 CUDA 12 组件库）；
    # 锁进依赖后 uv sync 在 Windows 上天然装 GPU 版，不会与 CPU 版 onnxruntime 互相覆盖
    "onnxruntime-gpu==1.26.*; sys_platform == 'win32'",
    "nvidia-cudnn-cu12; sys_platform == 'win32'",
    "nvidia-cuda-runtime-cu12; sys_platform == 'win32'",
    "nvidia-cufft-cu12; sys_platform == 'win32'",
    "nvidia-curand-cu12; sys_platform == 'win32'",
    "nvidia-cuda-nvrtc-cu12; sys_platform == 'win32'",
    # M2：悬浮窗 GUI 与字幕解析
    "PyQt6>=6.6.0",
    "pysrt>=1.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.22.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
gpu = [
    "nvidia-ml-py>=12.0.0",
]

[tool.uv]
package = false
# faster-whisper 传递依赖的 onnxruntime（CPU 版）在 Windows 上由 onnxruntime-gpu 替代
#（两发行版安装同名模块文件，不能共存；GPU 版功能为 CPU 版超集）
override-dependencies = ["onnxruntime>=1.14,<2; sys_platform != 'win32'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
