[project]
name = "asr2class"
version = "0.1.0"
description = "实时语音识别翻译与语言学习工具 (Real-time ASR + LLM translation learning tool)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "openai>=1.50.0",
    "pyyaml>=6.0",
    # WASAPI loopback（系统音内录）仅 Windows 可用；WSL/Linux 开发环境自动跳过
    "pyaudiowpatch>=0.2.12; sys_platform == 'win32'",
    # Windows 上 ctranslate2 的 CUDA 运行时（cuBLAS 12 + cuDNN 9）；
    # 缺失时报 cublas64_12.dll / cudnn*.dll not found
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12; sys_platform == 'win32'",
    # M2：悬浮窗 GUI 与字幕解析
    "PyQt6>=6.6.0",
    "pysrt>=1.1.2",
    # M3 后续：运行时指标（C 栏 CPU/RAM/GPU/VRAM 显示）
    "psutil>=5.9",
    "nvidia-ml-py>=12.0.0",
    # M3 阶段 5：离线批处理的媒体解码（直接使用，不依赖传递依赖）
    "av>=12.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.22.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
